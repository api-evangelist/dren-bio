name: Dren Bio
description: >-
  Dren Bio is a clinical-stage biopharmaceutical company based in Foster City, California,
  focused on the discovery and development of novel antibody therapeutics that selectively
  deplete pathogenic cells and other disease-causing agents. Its proprietary Targeted Myeloid
  Engager and Phagocytosis Platform is a multispecific, antibody-based technology designed to
  induce potent depletion of disease-causing agents by engaging a novel phagocytic receptor
  selectively expressed on myeloid cells. The pipeline spans two first-in-class clinical-stage
  programs (including DR-01 and DR-0202) plus multiple preclinical and discovery-stage programs
  across oncology, autoimmune disease, immunology, and neurology. Dren Bio has established
  strategic collaborations with Pfizer and Sanofi, the latter of which acquired its DR-0201
  (SAR448501) bispecific myeloid cell engager program. The company was surfaced as a portfolio
  company of 8vc and added to the API Evangelist network. It publishes no public API or
  developer surface; this profile captures its identity and public web properties.
